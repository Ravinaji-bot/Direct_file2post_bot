[loggers]
keys=root, plugins, database, dreamxbotz

[handlers]
keys=consoleHandler, fileHandler

[formatters]
keys=consoleFormatter, fileFormatter

[logger_root]
level=INFO
handlers=consoleHandler, fileHandler

[logger_plugins]
qualname=plugins
level=INFO
handlers=consoleHandler, fileHandler
propagate=0

[logger_dreamxbotz]
qualname=dreamxbotz
level=INFO
handlers=consoleHandler, fileHandler
propagate=0

[logger_database]
qualname=database
level=INFO
handlers=consoleHandler, fileHandler
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=consoleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=WARNING
formatter=fileFormatter
args=('DreamXlogs.txt', 'a')

[formatter_consoleFormatter]
format=[%(asctime)s] %(levelname)-8s | %(name)s:%(module)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %I:%M:%S %p

[formatter_fileFormatter]
format=[%(asctime)s] %(levelname)-8s | %(name)s:%(module)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %I:%M:%S %p